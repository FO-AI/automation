name: Reusable CI

on:
  workflow_call:
    inputs:
      checks:
        description: >-
          Nonempty JSON array of checks: name, directory, install, run,
          and optional node-version, python-version, pnpm-version, uv-version, env.
        required: true
        type: string
      containers:
        description: >-
          JSON array of container builds: name, context, file,
          and optional build-args (newline-separated string).
        required: false
        type: string
        default: '[]'

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.checks) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.directory }}
    env: ${{ matrix.env || fromJSON('{}') }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Install only the runtimes and package managers requested by this check.
      - name: Set up pnpm
        if: ${{ matrix['pnpm-version'] }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ matrix['pnpm-version'] }}
          run_install: false

      - name: Set up Node.js
        if: ${{ matrix['node-version'] }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix['node-version'] }}

      - name: Set up Python
        if: ${{ matrix['python-version'] }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix['python-version'] }}

      - name: Set up uv
        if: ${{ matrix['uv-version'] }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ matrix['uv-version'] }}
          enable-cache: false

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ matrix.install }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Run checks
        env:
          CHECK_COMMAND: ${{ matrix.run }}
        run: bash -euo pipefail -c "$CHECK_COMMAND"

  containers:
    name: Build ${{ matrix.name }}
    if: ${{ fromJSON(inputs.containers)[0] != null }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.containers) }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix['build-args'] }}
          push: false
