name: Reusable Azure CD

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing this app's deployment protection rules.
        type: string
        required: true
      deploy-command:
        description: Repository-owned command that builds, deploys, verifies health, and handles rollback.
        type: string
        required: true
      allow-manual:
        description: Allow an explicit manual redeploy of current main. Historical recovery remains app-owned.
        type: boolean
        default: false
      node-version:
        description: Optional Node.js version required by the repository's deployment command.
        type: string
        default: ''
      python-version:
        description: Optional Python version required by the repository's deployment command.
        type: string
        default: ''
      deployment-vars:
        description: JSON object of nonsecret environment variables for the deployment command.
        type: string
        default: '{}'
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      API_ENV_FILE:
        required: false
      WEB_ENV_FILE:
        required: false

permissions: {}

jobs:
  deploy:
    # Manual redeployment of current main is opt-in. Historical image recovery
    # stays in the app's existing workflow until it is migrated and verified.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' && inputs.allow-manual && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.action == 'completed' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env: ${{ fromJSON(inputs.deployment-vars) }}
    steps:
      - name: Check out the source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Python
        if: inputs.python-version != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Require the current main commit before Azure authentication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$DEPLOY_SHA" != "$main_sha" ]]; then
            printf '::error::Refusing stale deployment: %s is no longer main (%s).\n' "$DEPLOY_SHA" "$main_sha"
            exit 1
          fi

      - name: Validate Azure OIDC configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Set %s as a caller repository variable or a deployment secret.\n' "$name"
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      # The application owns image build/push, configuration, health verification,
      # and rollback in this command. This wrapper does not implement those steps.
      - name: Run the repository deployment command
        shell: bash
        env:
          DEPLOY_COMMAND: ${{ inputs.deploy-command }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
          WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
          # Resolve environment variables here, after the deployment environment
          # is selected; a caller job's inputs cannot read environment-only vars.
          DEPLOYMENT_VARS_JSON: ${{ toJSON(vars) }}
        run: bash -euo pipefail -c "$DEPLOY_COMMAND"
